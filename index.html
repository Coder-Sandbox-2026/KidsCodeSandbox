<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 Kids Code 3D</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/",
      "@dimforge/rapier3d-compat": "./node_modules/@dimforge/rapier3d-compat/dist/rapier.mjs",
      "monaco-editor": "./node_modules/monaco-editor/esm/vs/index.js"
    }
  }
  </script>
  <!-- Opening this source file via file:// cannot load npm packages. Send them to the bundled app. -->
  <script id="file-protocol-redirect">
    (function () {
      if (location.protocol !== 'file:') return;
      var path = location.pathname || '';
      if (!/index\.html$/i.test(path)) return;
      location.replace(location.href.replace(/index\.html$/i, 'KidsCode3D.html'));
    })();
  </script>
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <!-- Top toolbar -->
  <div id="toolbar">
    <span class="app-title">🎮 Kids Code 3D</span>

    <!-- Context group: mode, game type, level -->
    <div id="toolbar-context" class="toolbar-group toolbar-context">
      <span class="mode-label">MODE:</span>
      <div id="mode-dropdown" class="dropdown mode-dropdown">
        <button id="btn-mode" class="tb-btn" title="Select game mode">Create ▾</button>
        <div id="mode-menu" class="dropdown-menu hidden">
          <button data-mode="create" class="active">🖥 Create</button>
          <button data-mode="challenge">📦 Challenge</button>
        </div>
      </div>

      <!-- Game type selector -->
      <div id="game-type-dropdown" class="dropdown game-type-dropdown">
        <button id="btn-game-type" class="tb-btn" title="Select game type">First Person ▾</button>
        <div id="game-type-menu" class="dropdown-menu hidden">
          <button data-game-type="first-person" class="active">🖥 First Person</button>
        </div>
      </div>

      <!-- Level selector -->
      <div id="level-dropdown" class="dropdown level-dropdown">
        <button id="btn-level" class="tb-btn" title="Select a level">Level 1 ▾</button>
        <div id="level-menu" class="dropdown-menu hidden">
          <button data-level="1" class="active">📦 Level 1</button>
        </div>
      </div>

      <!-- Challenge mode controls (hidden by default) -->
      <div id="challenge-controls" class="toolbar-group challenge-controls hidden">
        <div class="dropdown challenge-level-dropdown">
          <button id="btn-challenge-level" class="tb-btn" title="Select a challenge level">Challenge Level 1 ▾</button>
          <div id="challenge-level-menu" class="dropdown-menu hidden">
            <button data-challenge-level="1" class="active">📦 Challenge Level 1</button>
            <button data-challenge-level="2">📦 Challenge Level 2</button>
            <button data-challenge-level="3">📦 Challenge Level 3</button>
            <button data-challenge-level="4">📦 Challenge Level 4</button>
            <button data-challenge-level="5">📦 Challenge Level 5</button>
            <button data-challenge-level="6">📦 Challenge Level 6</button>
            <button data-challenge-level="7">📦 Challenge Level 7</button>
            <button data-challenge-level="8">📦 Challenge Level 8</button>
            <button data-challenge-level="9">📦 Challenge Level 9</button>
            <button data-challenge-level="10">📦 Challenge Level 10</button>
            <button data-challenge-level="11">📦 Challenge Level 11</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Execution group: run, stop, reset -->
    <div id="toolbar-execution" class="toolbar-group toolbar-execution">
      <button id="btn-run" class="tb-btn run" title="Run your code">▶ Run</button>
      <button id="btn-stop" class="tb-btn stop" title="Stop running code">■ Stop</button>
      <button id="btn-reset" class="tb-btn reset" title="Reset everything">↻ Reset</button>
    </div>

    <!-- Right utilities: save, settings, console, fullscreen -->
    <div class="toolbar-right">
      <div id="toolbar-actions" class="toolbar-group toolbar-actions">
        <button id="btn-save" class="tb-btn" title="Save code to browser">💾 Save</button>
        <button id="btn-settings" class="tb-btn" title="Open settings" aria-haspopup="dialog" aria-controls="settings-dialog" aria-expanded="false">⚙ Settings</button>
      </div>

      <button id="btn-console" class="tb-btn small" title="Toggle console">🖥</button>
      <button id="btn-fs" class="tb-btn small" title="Fullscreen viewport">⛶</button>
    </div>
  </div>

  <!-- Main split layout -->
  <div id="main">
    <!-- Left: code editor -->
    <div id="editor-pane">
      <div id="editor-container"></div>
      <!-- Console panel -->
      <div id="console-panel" class="hidden">
        <div id="console-header">
          <span>Console</span>
          <button id="console-clear">Clear</button>
        </div>
        <div id="console-output"></div>
      </div>
    </div>

    <!-- Resize handle -->
    <div id="resize-handle"></div>

    <!-- Right: 3D viewport -->
    <div id="viewport-pane">
      <div id="game-container"></div>
      <!-- HUD overlay -->
      <div id="hud-overlay"></div>
      <!-- Click-to-play overlay -->
      <div id="play-overlay">
        <div class="play-message">🎮 Click here to play!<br><small>WASD to move · Mouse to look · Space/Click to jump</small></div>
      </div>
    </div>
  </div>

  <div id="settings-backdrop" class="settings-backdrop hidden">
    <div id="settings-dialog" class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-header">
        <h2 id="settings-title">Settings</h2>
        <button type="button" id="settings-close" class="settings-close" aria-label="Close settings">✕</button>
      </header>
      <div id="settings-body" class="settings-body"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
